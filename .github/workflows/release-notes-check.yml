name: Release notes

# Every PR into main that changes the app must add plain-language bullets
# to CHANGELOG.md under "## Unreleased". The release build ships exactly the
# bullets added since the previous release (.github/scripts/release_notes.py)
# as the in-app "What's New" box, read by roofing contractors: say what they
# will notice or can now do, no technical words, at most 80 characters.
# A PR with no operator-visible change: add the label `no-release-notes`.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  notes:
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release-notes') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: App changed?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '^(cpp/|App resource/|vendor/)' \
              | grep -vE '^cpp/tests/|\.md$' >/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check CHANGELOG.md bullets
        if: steps.changed.outputs.app == 'true'
        run: python3 .github/scripts/release_notes.py --check "origin/${{ github.base_ref }}"
