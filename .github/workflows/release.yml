name: Release

# Builds the OCU on every push to main, packages a .deb (with embedded git SHA),
# computes a SHA256 sidecar, and publishes:
#   - rolling tag `latest`            (overwrites each push, OTA polls this)
#   - immutable tag `v-<short-sha>`   (per-build artifact for rollback)
#
# odrive_can: interface-only msg/srv pkg vendored in-tree at vendor/odrive_can/.
# We colcon-build it into a side workspace before the OCU build so
# `find_package(odrive_can REQUIRED)` in cpp/CMakeLists.txt resolves.
# Upstream lives in pilot_ws; the vendor copy is the contract snapshot.

on:
  push:
    branches: [main]
    # Skip CI for doc-only commits. CHANGELOG.md is intentionally NOT in this
    # list because the release-notes step reads it.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.cursor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    # Job-level env so both the colcon build (odrive_can) and the OCU CMake
    # configure pick up ccache automatically. CCACHE_BASEDIR makes hashes
    # path-relative so cache hits survive across runners with different
    # workspace paths.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version metadata
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          {
            echo "sha=${SHORT_SHA}"
            echo "build_number=${BUILD_NUMBER}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Add ROS2 apt repository
        run: |
          sudo apt update
          sudo apt install -y curl gnupg lsb-release software-properties-common
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt update

      - name: Install build deps
        # Plain apt install. We tried awalsh128/cache-apt-pkgs-action for
        # apt-level caching but it dropped transitive deps from meta-
        # packages (libboost-all-dev → libboost1.74-dev), causing PCL
        # builds to fail with "boost/mpl/assert.hpp: No such file".
        # ccache below is the bigger speedup anyway; the ~60s saved by
        # apt caching isn't worth the reliability cost.
        #
        # Fields2Cover deps:
        #   - libgdal-dev / libgeos-dev / libtinyxml2-dev: link-time headers
        #     for F2C's geo stack. Runtime equivalents (libgdal30,
        #     libgeos-c1v5, libtinyxml2-9) ship via the OCU .deb's
        #     Depends: line so end-user OCUs pull them in via apt.
        #   - ros-humble-ortools-vendor: F2C is built with USE_ORTOOLS_VENDOR=ON
        #     (mirrors the dev workflow in pilot_ws). The vendor pkg
        #     provides /opt/ros/humble/opt/ortools_vendor/lib/libortools.so.9
        #     which libFields2Cover.so links against.
        run: |
          sudo apt install -y \
            build-essential cmake pkg-config git \
            python3-colcon-common-extensions python3-rosdep \
            qtbase5-dev libqt5widgets5 libqt5gui5 libqt5network5 \
            libqt5concurrent5 libqt5svg5-dev \
            libpcl-dev libeigen3-dev \
            libboost-all-dev \
            libunwind-dev \
            libopenmpi-dev libmpich-dev \
            libcgal-dev \
            libgdal-dev libgeos-dev libtinyxml2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            ros-humble-ros-base ros-humble-rclcpp ros-humble-std-msgs \
            ros-humble-std-srvs ros-humble-geometry-msgs ros-humble-sensor-msgs \
            ros-humble-nav-msgs ros-humble-tf2 ros-humble-tf2-geometry-msgs \
            ros-humble-ament-cmake ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-ortools-vendor

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}
          max-size: "500M"

      - name: Build vendored ROS2 interface packages
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p _ros_ws/src
          ln -sfn "${GITHUB_WORKSPACE}/vendor/odrive_can" _ros_ws/src/odrive_can
          cd _ros_ws
          colcon build --packages-select odrive_can --merge-install

      - name: Build and install Fields2Cover (pinned v2.0.0)
        # Fields2Cover has no upstream apt package, so CI clones it at a
        # pinned tag, builds it, and installs to /usr/local. The OCU's
        # cpp/CMakeLists.txt uses find_package(Fields2Cover QUIET); the
        # /usr/local install makes that resolve and sets HAVE_FIELDS2COVER
        # at compile time. The .deb packaging step then bundles the
        # resulting libFields2Cover.so* (+ libsteering_functions.so,
        # libmatplot.so*) into /usr/lib/bdr-coverage-planner/ so end-user
        # OCUs don't need a /usr/local install.
        #
        # Pinned to v2.0.0 to match the version pilot_ws uses
        # (verified: `git -C pilot_ws/src/Fields2Cover describe --tags`).
        # Bump only after testing, since F2C has had breaking API
        # changes between 1.x and 2.x.
        #
        # USE_ORTOOLS_VENDOR=ON makes F2C resolve OR-Tools from
        # /opt/ros/humble/opt/ortools_vendor/lib (provided by
        # ros-humble-ortools-vendor, declared as a runtime Depends in
        # cpp/create_deb.sh so the operator's OCU has it too).
        #
        # BUILD_TUTORIALS / BUILD_PYTHON disabled to skip extras the
        # OCU doesn't use; saves ~2 min of build time.
        run: |
          source /opt/ros/humble/setup.bash
          git clone --depth 1 --branch v2.0.0 \
            https://github.com/Fields2Cover/Fields2Cover.git _f2c_src
          cmake -S _f2c_src -B _f2c_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_DOC=OFF \
            -DUSE_ORTOOLS_VENDOR=ON
          cmake --build _f2c_build -j$(nproc)
          sudo cmake --install _f2c_build
          sudo ldconfig

      - name: Build OCU
        working-directory: cpp
        run: |
          source /opt/ros/humble/setup.bash
          source "${GITHUB_WORKSPACE}/_ros_ws/install/setup.bash"
          ./build.sh Release

      - name: Package .deb
        working-directory: cpp
        env:
          BDR_VERSION_SEMVER: "1.0.0"
          BDR_VERSION_SHA: ${{ steps.meta.outputs.sha }}
          BDR_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          source /opt/ros/humble/setup.bash
          source "${GITHUB_WORKSPACE}/_ros_ws/install/setup.bash"
          ./create_deb.sh
          ls -la build/*.deb

      - name: Locate .deb + compute SHA256 sidecar
        id: artifacts
        working-directory: cpp/build
        run: |
          DEB_FILE="$(ls bdr-coverage-planner_*_amd64.deb | head -n1)"
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb produced by create_deb.sh"
            exit 1
          fi
          sha256sum "$DEB_FILE" > "${DEB_FILE}.sha256"
          echo "deb_path=cpp/build/${DEB_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha256_path=cpp/build/${DEB_FILE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Print everything from after the first `## ` heading to (but not
          # including) the next `## ` heading. Leading/trailing blank lines
          # trimmed. Falls back to "No release notes" if extraction yields
          # nothing.
          NOTES="$(awk '/^## /{if(p)exit;p=1;next}p' CHANGELOG.md \
                    | sed -e '/./,$!d' -e ':a;/^\n*$/{$d;N;ba;}' || true)"
          if [ -z "$NOTES" ]; then
            NOTES="No release notes provided."
          fi
          {
            echo 'body<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest (${{ steps.meta.outputs.sha }})"
          body: ${{ steps.notes.outputs.body }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.deb_path }}
            ${{ steps.artifacts.outputs.sha256_path }}

      - name: Publish immutable per-SHA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ steps.meta.outputs.sha }}
          name: "v-${{ steps.meta.outputs.sha }}"
          body: ${{ steps.notes.outputs.body }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.deb_path }}
            ${{ steps.artifacts.outputs.sha256_path }}
